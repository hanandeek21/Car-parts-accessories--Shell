<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Group 14 - Car Parts & Accessories Microfrontend</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f8fafc; color: #0f172a; }
    
    header { background: #1e293b; color: white; padding: 1.5rem; text-align: center; }
    header h1 { font-size: 1.8rem; margin-bottom: 0.3rem; }
    header p { color: #94a3b8; font-size: 0.95rem; }

    .container { max-width: 1300px; margin: 30px auto; padding: 0 20px; display: flex; flex-direction: column; gap: 30px; }
    
    .module-card { background: white; border-radius: 12px; border: 1px solid #e2e8f0; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    .module-header { background: #f1f5f9; padding: 14px 20px; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; }
    .module-title { font-size: 1.1rem; font-weight: 600; color: #334155; }
    
    .badge { padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }
    .badge-vue { background: #dcfce7; color: #166534; }
    .badge-react { background: #e0f2fe; color: #075985; }
    .badge-net { background: #fef3c7; color: #92400e; }

    iframe { width: 100%; height: 750px; border: none; display: block; }
  </style>
</head>
<body>

  <header>
    <h1>Car Parts & Accessories Store</h1>
    <p>Group 14 — CBSE Microfrontend Application Shell</p>
  </header>

  <main class="container">

   
    <div class="module-card">
      <div class="module-header">
        <span class="module-title">Catalog & Discovery Component (Hanan)</span>
        <span class="badge badge-vue">Vue 3 / Vuetify</span>
      </div>
      <iframe src="https://carparts-catalog-vue.vercel.app"></iframe>
    </div>

  
    <div class="module-card">
      <div class="module-header">
        <span class="module-title">Cart & Checkout Component (Mohammad)</span>
        <span class="badge badge-net">Netlify App</span>
      </div>
      <iframe src="https://checkoutapp1.netlify.app/"></iframe>
    </div>

   
    <div class="module-card">
      <div class="module-header">
        <span class="module-title">Account & Orders Component (Yahya)</span>
        <span class="badge badge-react">React</span>
      </div>
      <iframe src="https://e-commerce-microfrontend-account-or.vercel.app/login"></iframe>
    </div>

  </main>

</body>
</html>
